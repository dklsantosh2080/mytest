// ------ EXCEL IMPORT LOGIC START ------
function parseTSV(text) {
    const rows = [];
    let row = [], cur = '', inQ = false;
    const firstLine = text.split(/\r?\n/, 1)[0] || '';
    const tabCount = (firstLine.match(/\t/g) || []).length;
    const commaCount = (firstLine.match(/,/g) || []).length;
    const semiCount = (firstLine.match(/;/g) || []).length;
    const sep = tabCount > 0 ? '\t' : commaCount >= semiCount ? ',' : ';';   // Excel paste = TAB; commas inside numbers/names must not change the delimiter
    for (let i = 0; i < text.length; i++) {
        const ch = text[i], nx = text[i + 1];
        if (inQ) {
            if (ch === '"' && nx === '"') { cur += '"'; i++; }
            else if (ch === '"') { inQ = false; }
            else { cur += ch; }
        } else {
            if (ch === '"' && cur === '') { inQ = true; }
            else if (ch === sep) { row.push(cur.trim()); cur = ''; }
            else if (ch === '\r' && nx === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; i++; }
            else if (ch === '\n' || ch === '\r') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
            else { cur += ch; }
        }
    }
    if (cur !== '' || row.length > 0) {
        row.push(cur.trim());
        if (row.some(c => c !== '')) rows.push(row);
    }
    return rows;
}

// Auto-calculated fields: ignore whatever was pasted/imported for them and
// recompute from the other imported values (same formulas the forms use).
function impCalcFn(t) {
    const fmc = x => {
        const p = ok(x['Authorized Person']) ? (db[PR] || []).find(y => y.Name == x['Authorized Person']) : null;
        x['Phone Number'] = p && ok(p['Phone No']) ? p['Phone No'] : null;
        return x;
    };
    return t === LG ? lgc
        : t === CT ? ctc
        : t === TB ? bdc
        : (t === BIL || t === PBIL || t === YBIL) ? blc
        : (t === XH || t === XP || t === XY) ? xlc
        : t === JMT ? (x => jbc(x, 'जमानतको प्रकार'))
        : t === BMA ? (x => jbc(x, 'बिमाको प्रकार'))
        : (t === FM || t === JV) ? fmc
        : null;
}

function impCalc(t, r) {
    const calc = impCalcFn(t);
    if (!calc) return r;
    (C[t].auto || []).forEach(c => { r[c] = null; }); // drop imported value of every auto field
    calc(r);                                          // fill it from the calculation
    return r;
}

// Columns the user does not need to paste: auto-calculated fields + the auto-numbered serial column.
function impAutoCols(t) {
    const hd = impH(t);
    const serial = (!C[t].ro && ['क्र.स', 'S.N', 'S.N.', 'S.No.'].includes(hd[0])) ? [hd[0]] : [];
    const auto = impCalcFn(t) ? (C[t].auto || []) : [];
    return [...new Set([...auto, ...serial])];
}

function processImportText(t, text) {
    if (!text || !text.trim()) return toast('No data found to import!');
    if (t === SMT) return processSmtImport(text);
    const hs = impH(t);
    const rows = parseTSV(text);
    if (!rows.length) return toast('No valid rows found!');

    // Automatically skip header row if the first row matches table headings
    const first = rows[0];
    const headerMatches = first.filter((c, i) => hs.includes(c) || (hs[i] && c === hs[i]) || hs.some(h => L[h] === c)).length;
    if (headerMatches >= 2 || first.includes('PLMBIS') || first[0] === 'क्र.स' || first[0] === 'S.N') {
        rows.shift();
    }

    // Column mapping:
    //  - pasted width == all columns        -> same position (col 2 -> col 2, ...); auto columns are ignored and recalculated
    //  - pasted width == non-auto columns   -> data goes to the non-auto columns in order; auto columns are calculated
    const autoSet = new Set(impAutoCols(t));
    const manual = hs.filter(h => !autoSet.has(h));
    const width = Math.max(0, ...rows.map(r => r.length));
    const cm = (autoSet.size && width < hs.length && width <= manual.length) ? manual : hs;

    let conflicts = [];
    let newRecords = [];
    const numCols = C[t].num || [];

    rows.forEach(row => {
        if (!row.some(c => c !== '')) return;
        let obj = {};
        hs.forEach(colName => { obj[colName] = null; });
        cm.forEach((colName, idx) => {
            let val = idx < row.length ? row[idx] : '';
            if (val === '') {
                obj[colName] = null;
            } else if (numCols.includes(colName)) {
                const n = Number(String(val).replace(/[,%\s]/g, ''));
                obj[colName] = isNaN(n) ? val : (IDN.includes(colName) ? n : r2(n));
            } else {
                obj[colName] = (C[t].multi || []).includes(colName) ? mv(val) : val;
            }
        });

        impCalc(t, obj);

        let existingIndex = -1;
        if (NM.includes(t)) {
            if (!ok(obj.Name)) return;
            existingIndex = db[t].findIndex(x => String(x.Name ?? '') === String(obj.Name));
        } else if (t === LG) {
            if (!ok(obj.No)) return;
            existingIndex = db[t].findIndex(x => String(x.EID ?? '') === String(obj.EID));
        } else if (C[t].uk) {
            if (!ok(obj[C[t].uk[0]])) return;
            existingIndex = db[t].findIndex(x => C[t].uk.every(c => String(x[c] ?? '') === String(obj[c] ?? '')));
        } else if (t === 'Activity Detail स्रोतगत' || t === 'फाँटबारि स्रोतगत') {
            if (ok(obj.PLMBIS) && ok(obj['स्रोत'])) {
                existingIndex = db[t].findIndex(x => String(x.PLMBIS ?? '') === String(obj.PLMBIS) && String(x['स्रोत'] ?? '') === String(obj['स्रोत']));
            }
        } else if (t === 'Activity Detail' || t === 'फाँटबारि') {
            if (ok(obj.PLMBIS)) {
                existingIndex = db[t].findIndex(x => String(x.PLMBIS ?? '') === String(obj.PLMBIS));
            }
        } else if (t === 'ठेक्का विवरण') {
            if (ok(obj.C_ID)) {
                existingIndex = db[t].findIndex(x => String(x.C_ID ?? '') === String(obj.C_ID));
            }
        } else if (t === 'ठेक्का बजेट व्यवस्थापन') {
            if (ok(obj.SH_ID)) {
                existingIndex = db[t].findIndex(x => String(x.SH_ID ?? '') === String(obj.SH_ID));
            } else if (ok(obj.EID)) {
                existingIndex = db[t].findIndex(x => String(x.EID ?? '') === String(obj.EID));
            }
        }

        if (existingIndex > -1) {
            conflicts.push({ index: existingIndex, newRow: obj });
        } else {
            newRecords.push(obj);
        }
    });

    if (!newRecords.length && !conflicts.length) {
        return toast('No data rows found to import.');
    }

    if (conflicts.length > 0) {
        askConflictResolution(t, newRecords, conflicts);
    } else {
        window.tempImport = { newRecords, conflicts: [] };
        execImport(t);
    }
}

// ---- ठेक्का सम्झौता import: ONLY AD, CD and Contractor Name are read; every other pasted column is ignored ----
function processSmtImport(text) {
    // tolerant text helpers: NFC, strip zero-width/BOM/NBSP, collapse spaces; key() also ignores case, spaces, _ . -
    const norm = s => String(s ?? '').normalize('NFC').replace(/[\u200b-\u200d\u2060\ufeff]/g, '').replace(/[\s\u00a0]+/g, ' ').trim();
    const key = s => norm(s).toLowerCase().replace(/[\s_.\-]/g, '');
    const ALIAS = {
        id: ['C_ID', 'CID', 'ठेक्का नं', 'ठेक्का नम्बर'],
        AD: ['AD', 'Agreement Date', 'सम्झौता मिति', 'सम्झौता भएको मिति'],
        CD: ['CD', 'Contract Duration', 'सम्झौता अवधि', 'अवधि'],
        CN: ['Contractor Name', 'Contractor', 'Name of Contractor', 'Contractor_Name', 'ठेकेदार', 'ठेकेदारको नाम', 'व्यवसायी', 'व्यवसायीको नाम', 'निर्माण व्यवसायी']
    };
    const AK = {}; Object.keys(ALIAS).forEach(k => AK[k] = ALIAS[k].map(key));
    const rows = parseTSV(text).map(r => r.map(norm)).filter(r => r.some(c => c !== ''));
    if (!rows.length) return toast('No valid rows found!');
    const hs = impH(SMT);                       // S.N, C_ID, WPS ... CA, AD, CD, Contractor Name, Remarks
    let ix = { id: hs.indexOf('C_ID'), AD: hs.indexOf('AD'), CD: hs.indexOf('CD'), CN: hs.indexOf('Contractor Name') };
    const first = rows[0];
    const find = k => first.findIndex(c => AK[k].includes(key(c)));
    const hdr = { id: find('id'), AD: find('AD'), CD: find('CD'), CN: find('CN') };
    const named = hdr.AD >= 0 || hdr.CD >= 0 || hdr.CN >= 0;
    let warn = '';
    if (named) {                                // header row copied -> map by heading names (case / spacing / Nepali tolerant)
        ix = hdr;
        rows.shift();
        if (ix.CN < 0) warn = ' · ⚠ Contractor Name column NOT found in your heading row (headings read: ' + first.filter(c => c !== '').join(' | ') + ')';
    } else {
        if (first[0] === 'S.N' || first[0] === 'क्र.स.' || hdr.id >= 0) rows.shift();   // plain header row
        const width = Math.max(0, ...rows.map(r => r.length));
        if (width >= hs.length - 1) { /* full-table paste: S.N, C_ID, Contract Name ... Contractor Name (Remarks optional) */
            if (width === hs.length - 1) {      // 13 cols = new layout without Remarks OR old layout (no Contract Name) with Remarks
                const c2 = rows.map(r => r[2]).filter(v => v !== '' && v != null);
                if (c2.length && c2.every(v => /^-?[\d,]*\.?\d+$/.test(v))) ix = { id: 1, AD: 9, CD: 10, CN: 11 };   // numeric in col 3 = old WPS column
            }
        }
        else if (width === 3) ix = { id: -1, AD: 0, CD: 1, CN: 2 };       // only AD | CD | Contractor Name
        else return toast('Paste the full table columns (S.N to Contractor Name) or only AD | CD | Contractor Name.');
    }
    if (ix.AD < 0 && ix.CD < 0 && ix.CN < 0) return toast('AD, CD or Contractor Name column not found.');
    if (!rows.length) return toast('No data rows found to import.');

    const tbl = db[SMT] || [];
    const known = new Map(); (db[EK] || []).forEach(x => { if (ok(x.Name) && !known.has(key(x.Name))) known.set(key(x.Name), x.Name); });
    let done = 0, miss = 0, names = 0, noName = new Set();
    rows.forEach((row, k) => {
        let rec = null;
        if (ix.id >= 0) { const id = norm(row[ix.id]); rec = id ? tbl.find(x => norm(x.C_ID) === id) : null; }
        else rec = tbl[k];                      // 3-column paste: row order
        if (!rec) { miss++; return; }
        const g = i => (i >= 0 && i < row.length ? row[i] : '');
        const ad = g(ix.AD), cd = g(ix.CD), cn = g(ix.CN);
        if (ad === '' && cd === '' && cn === '') return;
        if (ad !== '') rec.AD = ad;             // blank cells never wipe existing data
        if (cd !== '') rec.CD = cd;
        if (cn !== '') {
            const canon = known.get(key(cn));   // snap to the exact spelling stored in एकिकृत when it matches
            rec['Contractor Name'] = canon ?? cn;
            if (!canon) noName.add(cn);
            names++;
        }
        done++;
    });
    recalc(); save(); render();
    toast(`Imported AD / CD / Contractor Name for ${done} agreement(s) · ${names} contractor name(s)` + (miss ? ` · ${miss} row(s) not matched by C_ID` : '') + (noName.size ? ` · ${noName.size} contractor name(s) not in एकिकृत (shown in red)` : '') + warn);
}

                ${isSrc ? `<td>${e(c.newRow['स्रोत'])}</td>` : ''}
                <td>${e(c.newRow[nmC] ?? '')}</td>
                <td style="white-space:nowrap">${e(fmt(t, amC, c.newRow[amC] ?? ''))}</td>`}
                <td style="white-space:nowrap">
                    <label><input type="radio" name="conf_${i}" value="replace" checked> Copy &amp; Replace</label>
                    <label style="margin-left:10px"><input type="radio" name="conf_${i}" value="keep"> Keep Original</label>
                </td>
            </tr>
        `).join('')}
        </tbody></table>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button onclick="$('import_md').remove()">Cancel</button>
            <button class=p onclick="execImport('${t}')">Import Selected</button>
        </div>
    </div></div>`;
    $('ov').insertAdjacentHTML('beforeend', html);
    window.tempImport = { newRecords, conflicts };
}

function execImport(t) {
    let toReplace = [];
    window.tempImport.conflicts.forEach((c, i) => {
        const el = document.querySelector(`input[name="conf_${i}"]:checked`);
        if (el && el.value === 'replace') toReplace.push(c);
    });

    const snCol = (C[t].hd||['S.N'])[0];
    let nextId = Math.max(0, ...db[t].map(x => +(x[snCol] || 0)));

    window.tempImport.newRecords.forEach(r => {
        if (!ok(r[snCol])) r[snCol] = ++nextId;
        else if (+r[snCol] > nextId) nextId = +r[snCol];
        if (!C[t].noid && !ok(r.ID)) r.ID = C[t].p + String(1 + Math.max(0, ...db[t].map(x => parseInt(String(x.ID ?? '').replace(/\D/g, '')) || 0))).padStart(3, '0');
        db[t].push(r);
    });

    toReplace.forEach(c => {
        let existing = db[t][c.index];
        Object.keys(c.newRow).forEach(k => {
            if (k === snCol && !ok(c.newRow[k])) return;
            existing[k] = c.newRow[k];
        });
        impCalc(t, existing);
    });

    recalc();
    save();
    render();
    toast(`Imported: ${window.tempImport.newRecords.length} added, ${toReplace.length} replaced`);
    let md = $('import_md');
    if (md) md.remove();
    delete window.tempImport;
}

function sha256(str){const b=new TextEncoder().encode(str),l=b.length,n=(((l+8)>>6)+1)<<4,w=new Uint32Array(n);

<script>
(function(){
/* Nepali (Bikram Sambat) date picker. Month lengths for BS 2000-2090: each digit = days-29. */
const T={"2000":"132321110102","2001":"223222101011","2002":"223321101011","2003":"232321110012","2004":"132321110102","2005":"223222101011","2006":"223321101011","2007":"232321110012","2008":"222322011002","2009":"223222101011","2010":"223321101011","2011":"232321110012","2012":"222322011011","2013":"223222101011","2014":"223321101011","2015":"232321110012","2016":"222322011011","2017":"223222101011","2018":"232321101011","2019":"232321110102","2020":"222322101011","2021":"223222101011","2022":"232321110011","2023":"232321110102","2024":"222322101011","2025":"223222101011","2026":"232321110012","2027":"132321110102","2028":"223222101011","2029":"223231101011","2030":"232321110012","2031":"132321110102","2032":"223222101011","2033":"223321101011","2034":"232321110012","2035":"132322011002","2036":"223222101011","2037":"223321101011","2038":"232321110012","2039":"222322011011","2040":"223222101011","2041":"223321101011","2042":"232321110012","2043":"222322011011","2044":"223222101011","2045":"232321101011","2046":"232321110012","2047":"222322101011","2048":"223222101011","2049":"232321110011","2050":"232321110102","2051":"222322101011","2052":"223222101011","2053":"232321110011","2054":"232321110102","2055":"223222101011","2056":"223231101011","2057":"232321110012","2058":"132321110102","2059":"223222101011","2060":"223321101011","2061":"232321110012","2062":"132322010102","2063":"223222101011","2064":"223321101011","2065":"232321110012","2066":"222322011002","2067":"223222101011","2068":"223321101011","2069":"232321110012","2070":"222322011011","2071":"223222101011","2072":"232321101011","2073":"232321110012","2074":"222322101011","2075":"223222101011","2076":"232321110011","2077":"232321110102","2078":"222322101011","2079":"223222101011","2080":"232321110011","2081":"223321110111","2082":"132321110111","2083":"223221110111","2084":"223221110111","2085":"232312110111","2086":"132321110111","2087":"223222110111","2088":"123312110111","2089":"132321110111","2090":"132321110111"};
const Y0=2000,Y1=2090,EP=Date.UTC(1943,3,14),DAY=864e5;
const MN=['बैशाख','जेठ','असार','श्रावण','भदौ','असोज','कार्तिक','मंसिर','पौष','माघ','फागुन','चैत्र'];
const WD=['आइत','सोम','मङ्गल','बुध','बिही','शुक्र','शनि'];
const ND='०१२३४५६७८९',np=n=>String(n).replace(/\d/g,d=>ND[d]);
const dim=(y,m)=>29+ +T[y][m-1];
const ys={};let acc=0;for(let y=Y0;y<=Y1;y++){ys[y]=acc;for(let m=1;m<=12;m++)acc+=dim(y,m)}
const TOTAL=acc;
const bs2ms=(y,m,d)=>{let n=ys[y]+d-1;for(let i=1;i<m;i++)n+=dim(y,i);return EP+n*DAY};
function ms2bs(ms){let n=Math.round((ms-EP)/DAY);if(n<0||n>=TOTAL)return null;let y=Y0;while(y<Y1&&n>=ys[y+1])y++;n-=ys[y];let m=1;while(m<12&&n>=dim(y,m)){n-=dim(y,m);m++}return{y,m,d:n+1}}
const p2=n=>String(n).padStart(2,'0'),iso=ms=>{const d=new Date(ms);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())};
const bsTxt=(b,s)=>b.y+(s||'-')+p2(b.m)+(s||'-')+p2(b.d);
const todayMs=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
const asc=s=>String(s).replace(/[०-९]/g,c=>ND.indexOf(c));
function parse(s){const a=asc(s).trim().match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return a?{y:+a[1],m:+a[2],d:+a[3]}:null}
/* Fields that store a B.S. date as text; and the one that stores an A.D. date (ISO) */
const BSF=new Set(['Tippani_Date','Approved_Date','Date','AD','जारि मिति','जारि म्याद','संशोधन मिति','संशोधित म्याद','निवेदन मिति','नयाँ म्याद','निर्णय मिति','प्रस्ताव मिति','स्वीकृत मिति','CD']),ADF=new Set(['Operation Date (A.D.)']);
const isDF=el=>el&&el.tagName=='INPUT'&&el.form&&(BSF.has(el.name)||ADF.has(el.name))&&!el.readOnly&&!el.disabled;
let pop=null,cur=null,vy,vm,selB=null,ddo=null;
const kind=el=>ADF.has(el.name)?'ad':'bs';
/* value in the input -> BS object (or null) */
function read(el){const p=parse(el.value);if(!p)return null;
 if(kind(el)=='ad'||p.y<2050){if(p.m<1||p.m>12||p.d<1||p.d>31)return null;return ms2bs(Date.UTC(p.y,p.m-1,p.d))}
 if(p.y<Y0||p.y>Y1||p.m<1||p.m>12||p.d<1||p.d>dim(p.y,p.m))return null;return p}
function info(){const i=pop.querySelector('.i');if(!selB){i.textContent=kind(cur)=='ad'?'मिति छान्नुहोस् (A.D. मा सेभ हुनेछ)':'मिति छान्नुहोस्';return}
 i.textContent=np(bsTxt(selB))+' वि.सं. = '+iso(bs2ms(selB.y,selB.m,selB.d))+' A.D.'}
function ddh(k,list,val){const c=list.find(x=>x[0]==val);
 return '<div class=dd><button type=button class=ddb data-a=dd data-k='+k+'><span>'+(c?c[1]:'')+'</span><i>▾</i></button>'+(ddo==k?'<div class=ddl>'+list.map(x=>'<div class="ddi'+(x[0]==val?' on':'')+'" data-a=ddp data-k='+k+' data-v='+x[0]+'>'+x[1]+'</div>').join('')+'</div>':'')+'</div>'}
function ddfix(){const l=pop.querySelector('.ddl');if(!l)return;const s=l.querySelector('.on');if(s)l.scrollTop=s.offsetTop-(l.clientHeight-s.offsetHeight)/2;if(l.getBoundingClientRect().bottom>innerHeight-4)l.classList.add('up')}
function draw(){const lo=2070;
 if(vy<lo){vy=lo;vm=1}if(vy>Y1){vy=Y1;vm=12}
 let h='<div class=h><button type=button data-a=py title="अघिल्लो वर्ष">«</button><button type=button data-a=pm title="अघिल्लो महिना">‹</button>'+ddh('sm',MN.map((n,i)=>[i+1,n]),vm)+ddh('sy',Array.from({length:Y1-lo+1},(_,j)=>[lo+j,np(lo+j)]),vy)+'<button type=button data-a=nm title="अर्को महिना">›</button><button type=button data-a=ny title="अर्को वर्ष">»</button></div><div class=g>';
 WD.forEach((w,i)=>h+='<div class="w'+(i==6?' s':'')+'">'+w+'</div>');
 const first=new Date(bs2ms(vy,vm,1)).getUTCDay(),n=dim(vy,vm),t=ms2bs(todayMs());
 for(let i=0;i<first;i++)h+='<div></div>';
 for(let d=1;d<=n;d++){const ad=new Date(bs2ms(vy,vm,d)).getUTCDate(),wd=(first+d-1)%7;
  const c='d'+(wd==6?' s':'')+(t&&t.y==vy&&t.m==vm&&t.d==d?' t':'')+(selB&&selB.y==vy&&selB.m==vm&&selB.d==d?' on':'');
  h+='<div class="'+c+'" data-d='+d+'><b>'+np(d)+'</b><small>'+ad+'</small></div>'}
 h+='</div><div class=i></div><div class=f><button type=button data-a=today>Today</button><button type=button data-a=clear>Clear</button><button type=button data-a=close>Close</button></div>';
 pop.innerHTML=h;info();place();ddfix()}
function place(){if(!cur||!cur.isConnected)return close();const r=cur.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
 let l=Math.max(6,Math.min(r.left,innerWidth-w-6)),t=r.bottom+4;if(t+h>innerHeight-6)t=Math.max(6,r.top-h-4);
 pop.style.left=l+'px';pop.style.top=t+'px'}
function close(){if(pop){pop.remove();pop=null}cur=null;ddo=null}
function fire(el){['input','change'].forEach(t=>el.dispatchEvent(new Event(t,{bubbles:true})))}
function pick(b){const el=cur;let v;
 if(kind(el)=='ad')v=iso(bs2ms(b.y,b.m,b.d));
 else{const s=(el.value.match(/^\s*\d{4}([^\d\s])/)||[])[1]||'-';v=bsTxt(b,s)}
 el.value=v;fire(el);close()}
function open(el){if(cur===el&&pop)return;close();cur=el;selB=read(el);const b=selB||ms2bs(todayMs())||{y:2083,m:1,d:1};
 vy=b.y;vm=b.m;ddo=null;pop=document.createElement('div');pop.id='bsdp';document.body.appendChild(pop);
 if(!el.placeholder)el.placeholder=kind(el)=='ad'?'YYYY-MM-DD (A.D.)':'YYYY-MM-DD (वि.सं.)';el.autocomplete='off';draw()}
document.addEventListener('focusin',e=>{if(isDF(e.target))open(e.target)});
document.addEventListener('click',e=>{if(isDF(e.target))open(e.target)});
document.addEventListener('input',e=>{if(pop&&e.target===cur&&e.isTrusted){selB=read(cur);if(selB){vy=selB.y;vm=selB.m}draw()}},true);
document.addEventListener('mousedown',e=>{if(!pop)return;if(pop.contains(e.target)){if(!/^(SELECT|OPTION)$/.test(e.target.tagName)&&!e.target.closest('.ddl'))e.preventDefault();return}if(e.target!==cur)close()},true);
document.addEventListener('keydown',e=>{if(!pop)return;if(e.key=='Escape'){const c=cur;close();c&&c.focus&&0;e.stopPropagation()}else if(e.key=='Tab'||e.key=='Enter')close()},true);
addEventListener('resize',()=>pop&&place());
addEventListener('scroll',e=>{if(pop&&!(e.target.nodeType==1&&pop.contains(e.target)))place()},true);
document.addEventListener('click',e=>{if(!pop||!pop.contains(e.target))return;const t=e.target.closest('[data-d],[data-a]');
 if(t&&t.dataset.a=='dd'){ddo=ddo==t.dataset.k?null:t.dataset.k;draw();return}
 if(t&&t.dataset.a=='ddp'){const v=+t.dataset.v;if(t.dataset.k=='sm')vm=v;else vy=v;ddo=null;draw();return}
 if(!t){if(ddo){ddo=null;draw()}return}ddo=null;
 if(t.dataset.d){pick({y:vy,m:vm,d:+t.dataset.d});return}
 const a=t.dataset.a;
 if(a=='close')close();
 else if(a=='clear'){const el=cur;el.value='';fire(el);close()}
 else if(a=='today'){const b=ms2bs(todayMs());if(b)pick(b)}
 else{if(a=='pm'){vm--;if(vm<1){vm=12;vy--}}else if(a=='nm'){vm++;if(vm>12){vm=1;vy++}}else if(a=='py')vy--;else if(a=='ny')vy++;draw()}
});
document.addEventListener('change',e=>{if(!pop||!pop.contains(e.target))return;const a=e.target.dataset.a;if(a=='sm')vm=+e.target.value;else if(a=='sy')vy=+e.target.value;else return;e.stopPropagation();draw()},true);
window.BSDate={bs2ad:(y,m,d)=>iso(bs2ms(y,m,d)),ad2bs:(y,m,d)=>ms2bs(Date.UTC(y,m-1,d))};
})();
